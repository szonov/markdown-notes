# Workspace for all Rust crates: the Tauri desktop shell, the `reflect` CLI,
# the shared index-schema crate, and first-party mobile plugins. One lockfile
# pins one SQLite everywhere — the desktop writer and the CLI reader can
# never skew.
[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/graph-paths", "crates/index-schema"]

[workspace.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
reflect-graph-paths = { path = "crates/graph-paths" }
tauri = "2.12.1"
tauri-plugin = { version = "2.7.1", features = ["build"] }
thiserror = "2.0.20"
