[package]
name = "reflect-open"
# Intentionally frozen: the app version lives in apps/desktop/package.json and
# tauri.conf.json points at it. The crate is never published, so its version
# has no consumer — freezing it keeps Cargo.lock out of every release diff.
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reflect_open_lib"
# `staticlib` links into the iOS app as `libapp.a`; `rlib` serves the desktop
# binary. There is no Android target, so no `cdylib`.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
infer = "0.19"
http-range-header = "0.4"

# `devtools` compiles the web inspector into release builds too (it is otherwise
# debug-only), so a shipped app stays debuggable — see `src/devtools.rs`.
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-opener = "2.7.0"
# Decodes `reflect-asset://` request paths (`fs/asset_protocol.rs`); the same
# crate tauri itself uses for its protocol URLs.
percent-encoding = "2.3.2"
# `time` backs the bounded wait in `windows::close_note_windows` (tauri
# already runs on tokio; this only makes the sleep primitive addressable).
tokio = { version = "1.53.1", features = ["time", "sync", "fs", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
# `hooks` adds the authorizer API used to lock the read-only `db_query` bridge
# down to pure reads (deny ATTACH/DETACH/PRAGMA); see `db/query.rs`.
rusqlite = { workspace = true, features = ["hooks"] }
reflect-index-schema = { path = "../../../crates/index-schema" }
reflect-graph-paths = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.1"
base64 = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
# unsafe-headers lets provider-fetch.ts pass an explicit empty Origin, which
# the plugin treats as "send no Origin header" (see providerFetch's doc).
image = { version = "0.25.10", default-features = false, features = [
  "gif",
  "ico",
  "jpeg",
  "png",
  "webp",
] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
# Reflect V1 exports are zip archives of the graph-folder layout. Keep the
# reader lean: stored entries plus the usual deflate method are enough here.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"
# Apple Calendar read-only bridge (`src/calendar.rs`): EventKit through the
# objc2 bindings, trimmed to the classes the modules touch. objc2-app-kit
# backs EKCalendar's NSColor → hex conversion and the Edit menu's Paste and
# Match Style item (`src/menu.rs`).
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSError",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
  "block2",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSColor",
  "NSColorSpace",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSWorkspace",
] }

# Apple Contacts integration (`contacts.rs`): live CNContactStore lookups on
# macOS and iOS — never a mirrored copy of the address book. block2 bridges the
# requestAccessForEntityType completion handler back into blocking Rust.
# core-foundation backs the iCloud/backup sync-exclusion resource keys on
# `.reflect/` and `.git/` (`fs/io.rs`), which matter on both Apple targets.
# dispatch2 supplies MainThreadBound, keeping the iCloud metadata query's
# non-Send Objective-C handles pinned to the main thread (`icloud/watch.rs`).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

# Finite-length execution assertions around iOS persistence. UIKit's begin/end
# methods keep file and SQLite locks from surviving process suspension.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "UIApplication",
  "block2",
] }

# Desktop-only capabilities (Plan 19): auto-update (mobile updates go through
# the app stores), window-state (no windows to restore on mobile), the file
# watcher (nothing else writes the mobile sandbox; local writes notify
# in-process), the embedding runtime (fastembed/ORT is not built for mobile —
# semantic search is desktop-only in the first mobile wave), and OS-trash
# deletes (mobile moves into the graph-local `.reflect/trash/` instead).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.5.0"
trash = "5.2.8"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# The watcher's pruned file-ID cache (rename stitching without the full-tree
# walk) reuses the debouncer's own building blocks directly.
file-id = "0.2.3"
walkdir = "2.5.0"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }

# Mobile-only capabilities (Plan 19): the first-party keyboard bridge and
# haptics plugins; desktop has no software keyboard and no haptic engine.
# Sharing uses the webview's Web Share API, `navigator.share`, so it needs
# no native plugin.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-keyboard = { path = "../../../plugins/tauri-plugin-keyboard" }
tauri-plugin-mobile-haptics = { path = "../../../plugins/tauri-plugin-mobile-haptics" }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
